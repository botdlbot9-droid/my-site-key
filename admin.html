<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Remote Control</title>
    <style>
        /* ================================================================
           CSS - Admin Panel Dark Theme
           ================================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a12;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: #1a1a2e;
            border-radius: 16px;
            padding: 30px;
            border: 1px solid #2a2a4e;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }

        .hidden {
            display: none !important;
        }

        /* ===== LOGIN PAGE ===== */
        #loginPage {
            text-align: center;
        }

        .lock-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .login-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-subtitle {
            color: #a0a0b8;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .login-input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 10px;
            border: 1px solid #2a2a4e;
            background: #0f0f23;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
            font-family: 'Segoe UI', sans-serif;
        }

        .login-input:focus {
            border-color: #f7971e;
            box-shadow: 0 0 0 3px rgba(247, 151, 30, 0.15);
        }

        .login-input::placeholder {
            color: #6a6a8a;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #0a0a12;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Segoe UI', sans-serif;
        }

        .login-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(247, 151, 30, 0.35);
        }

        .login-error {
            color: #ff6b6b;
            font-size: 14px;
            margin-top: 12px;
            min-height: 20px;
        }

        /* ===== ADMIN PANEL ===== */
        #adminPanel {
            text-align: center;
        }

        .admin-icon {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .admin-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .admin-subtitle {
            color: #a0a0b8;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .status-box {
            background: #12121e;
            border-radius: 10px;
            padding: 15px;
            border: 1px solid #2a2a4e;
            margin-bottom: 20px;
        }

        .status-box .label {
            color: #a0a0b8;
            font-size: 13px;
        }

        .status-box .value {
            font-size: 18px;
            font-weight: 700;
            margin-top: 5px;
        }

        .status-box .value.online {
            color: #00ff88;
        }

        .status-box .value.offline {
            color: #ff6b6b;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 14px 30px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Segoe UI', sans-serif;
            flex: 1;
            min-width: 120px;
        }

        .btn-pause {
            background: linear-gradient(135deg, #ff0044, #cc0033);
            color: #fff;
            box-shadow: 0 4px 20px rgba(255, 0, 68, 0.3);
        }

        .btn-pause:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 30px rgba(255, 0, 68, 0.5);
        }

        .btn-pause:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-resume {
            background: linear-gradient(135deg, #00ff88, #00cc66);
            color: #0a0a12;
            box-shadow: 0 4px 20px rgba(0, 255, 136, 0.3);
        }

        .btn-resume:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 30px rgba(0, 255, 136, 0.5);
        }

        .btn-resume:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-refresh {
            background: #0f0f23;
            border: 1px solid #2a2a4e;
            color: #a0a0b8;
            padding: 14px 20px;
            flex: 0.5;
            min-width: 60px;
        }

        .btn-refresh:hover {
            border-color: #f7971e;
            color: #fff;
        }

        .message {
            margin-top: 15px;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }

        .message.show {
            display: block;
        }

        .message.success {
            color: #00ff88;
            background: rgba(0, 255, 136, 0.08);
            border-left: 3px solid #00ff88;
        }

        .message.error {
            color: #ff6b6b;
            background: rgba(255, 0, 0, 0.08);
            border-left: 3px solid #ff6b6b;
        }

        .message.info {
            color: #f7971e;
            background: rgba(247, 151, 30, 0.08);
            border-left: 3px solid #f7971e;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            color: #6a6a8a;
            font-size: 12px;
            border-top: 1px solid #1a1a3e;
            padding-top: 18px;
        }

        .footer .highlight {
            color: #f7971e;
        }

        .last-updated {
            color: #6a6a8a;
            font-size: 11px;
            margin-top: 8px;
        }

        @media (max-width: 480px) {
            .container { padding: 20px; }
            .btn { min-width: 100px; padding: 12px 20px; font-size: 14px; }
            .btn-group { flex-direction: column; }
            .btn-refresh { flex: 1; }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== LOGIN PAGE ===== -->
        <div id="loginPage">
            <div class="lock-icon">🔐</div>
            <div class="login-title">Admin Panel</div>
            <div class="login-subtitle">Enter password to access remote control</div>
            <input type="password" class="login-input" id="passwordInput" placeholder="Enter password" autofocus>
            <button class="login-btn" onclick="login()">🔓 Unlock</button>
            <div id="loginError" class="login-error"></div>
        </div>

        <!-- ===== ADMIN PANEL ===== -->
        <div id="adminPanel" class="hidden">
            <div class="admin-icon">⚙️</div>
            <div class="admin-title">Remote Control</div>
            <div class="admin-subtitle">Manage your website status</div>

            <!-- Status Box -->
            <div class="status-box">
                <div class="label">📊 Current Status</div>
                <div class="value" id="statusValue">
                    <span id="statusText">Checking...</span>
                </div>
                <div style="margin-top: 8px; font-size: 12px; color: #6a6a8a;">
                    <span id="statusKey">Key: ---</span>
                </div>
            </div>

            <!-- Buttons -->
            <div class="btn-group">
                <button class="btn btn-pause" id="pauseBtn" onclick="pauseWebsite()">
                    ⏸️ Pause Website
                </button>
                <button class="btn btn-resume" id="resumeBtn" onclick="resumeWebsite()">
                    ▶️ Resume Website
                </button>
                <button class="btn btn-refresh" onclick="fetchStatus()" title="Refresh Status">
                    🔄
                </button>
            </div>

            <!-- Message -->
            <div id="adminMessage" class="message"></div>

            <!-- Last Updated -->
            <div class="last-updated" id="lastUpdated">Last updated: --</div>

            <div class="footer">
                ⚡ <span class="highlight">Remote Control</span> — GitHub Powered
            </div>
        </div>

    </div>

    <script>
        /**
         * ================================================================
         *  🔐 ADMIN PANEL - Remote Control
         *  - Password protected
         *  - GitHub JSON file update
         *  - Pause/Resume website
         * ================================================================
         */

        // ============================================================
        // 🔑 CONFIGURATION
        // ============================================================

        // ⭐⭐⭐ CHANGE THESE ⭐⭐⭐
        const ADMIN_PASSWORD = "admin123"; // ← Your admin password

        // ⭐⭐⭐ GITHUB CONFIGURATION ⭐⭐⭐
        const GITHUB_USERNAME = "romika449-ai";
        const GITHUB_REPO = "my-site-key";
        const GITHUB_FILE = "key.json";
        const GITHUB_BRANCH = "main";

        const GITHUB_RAW_URL = `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${GITHUB_REPO}/${GITHUB_BRANCH}/${GITHUB_FILE}`;
        const GITHUB_API_URL = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${GITHUB_FILE}`;

        // ⭐⭐⭐ YOUR WEBSITE KEY ⭐⭐⭐
        const WEBSITE_KEY = "Babbydol";

        // ============================================================
        // 📦 DOM REFS
        // ============================================================
        const loginPage = document.getElementById('loginPage');
        const adminPanel = document.getElementById('adminPanel');
        const passwordInput = document.getElementById('passwordInput');
        const loginError = document.getElementById('loginError');

        const statusText = document.getElementById('statusText');
        const statusKey = document.getElementById('statusKey');
        const pauseBtn = document.getElementById('pauseBtn');
        const resumeBtn = document.getElementById('resumeBtn');
        const adminMessage = document.getElementById('adminMessage');
        const lastUpdated = document.getElementById('lastUpdated');

        let currentStatus = 'unknown';
        let currentKey = '';

        // ============================================================
        // 🔐 LOGIN
        // ============================================================

        function login() {
            const password = passwordInput.value.trim();

            if (password === ADMIN_PASSWORD) {
                loginPage.classList.add('hidden');
                adminPanel.classList.remove('hidden');
                loginError.textContent = '';
                fetchStatus();
                // Auto refresh every 10 seconds
                setInterval(fetchStatus, 10000);
            } else {
                loginError.textContent = '❌ Invalid password! Please try again.';
                passwordInput.value = '';
                passwordInput.focus();
            }
        }

        // Enter key support for login
        passwordInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                login();
            }
        });

        // ============================================================
        // 📊 FETCH CURRENT STATUS
        // ============================================================

        async function fetchStatus() {
            try {
                const response = await fetch(GITHUB_RAW_URL, {
                    cache: 'no-cache',
                    headers: {
                        'Cache-Control': 'no-cache',
                        'Pragma': 'no-cache'
                    }
                });

                if (!response.ok) {
                    throw new Error('File not accessible (Status: ' + response.status + ')');
                }

                const data = await response.json();
                console.log('📥 Status data:', data);

                currentKey = data.key || 'unknown';
                currentStatus = data.status || 'unknown';

                updateUI(data);

            } catch (error) {
                console.error('❌ Fetch error:', error);
                statusText.textContent = '❌ Error fetching';
                statusText.className = 'value offline';
                statusKey.textContent = 'Key: ---';
                showAdminMessage('❌ Failed to fetch status: ' + error.message, 'error');
            }
        }

        function updateUI(data) {
            // Update status
            if (data.status === 'active') {
                statusText.textContent = '✅ Online (Active)';
                statusText.className = 'value online';
            } else if (data.status === 'inactive') {
                statusText.textContent = '❌ Offline (Paused)';
                statusText.className = 'value offline';
            } else {
                statusText.textContent = '⚠️ Unknown: ' + data.status;
                statusText.className = 'value';
            }

            // Update key
            statusKey.textContent = 'Key: ' + (data.key || '---');

            // Update last updated
            const now = new Date();
            lastUpdated.textContent = 'Last updated: ' + now.toLocaleTimeString();

            // Enable/disable buttons
            if (data.status === 'active') {
                pauseBtn.disabled = false;
                resumeBtn.disabled = true;
            } else if (data.status === 'inactive') {
                pauseBtn.disabled = true;
                resumeBtn.disabled = false;
            } else {
                pauseBtn.disabled = true;
                resumeBtn.disabled = true;
            }

            // Clear any old message
            hideAdminMessage();
        }

        // ============================================================
        // ⏸️ PAUSE WEBSITE
        // ============================================================

        async function pauseWebsite() {
            if (pauseBtn.disabled) return;

            pauseBtn.disabled = true;
            pauseBtn.textContent = '⏳ Processing...';
            showAdminMessage('⏳ Pausing website...', 'info');

            try {
                // Get current file from GitHub
                const fileResponse = await fetch(GITHUB_API_URL, {
                    headers: {
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (!fileResponse.ok) {
                    throw new Error('Failed to fetch file from GitHub');
                }

                const fileData = await fileResponse.json();
                const sha = fileData.sha;

                // Create new content (inactive)
                const newContent = {
                    status: "inactive",
                    key: WEBSITE_KEY
                };

                const contentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(newContent, null, 2))));

                // Update file on GitHub
                const updateResponse = await fetch(GITHUB_API_URL, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    body: JSON.stringify({
                        message: 'Paused website via admin panel',
                        content: contentBase64,
                        sha: sha,
                        branch: GITHUB_BRANCH
                    })
                });

                if (!updateResponse.ok) {
                    const errorData = await updateResponse.json();
                    throw new Error(errorData.message || 'Failed to update file');
                }

                showAdminMessage('✅ Website paused successfully!', 'success');
                // Wait and refresh status
                setTimeout(fetchStatus, 1000);

            } catch (error) {
                console.error('❌ Pause error:', error);
                showAdminMessage('❌ Failed to pause: ' + error.message, 'error');
                pauseBtn.disabled = false;
                pauseBtn.textContent = '⏸️ Pause Website';
            }
        }

        // ============================================================
        // ▶️ RESUME WEBSITE
        // ============================================================

        async function resumeWebsite() {
            if (resumeBtn.disabled) return;

            resumeBtn.disabled = true;
            resumeBtn.textContent = '⏳ Processing...';
            showAdminMessage('⏳ Resuming website...', 'info');

            try {
                // Get current file from GitHub
                const fileResponse = await fetch(GITHUB_API_URL, {
                    headers: {
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (!fileResponse.ok) {
                    throw new Error('Failed to fetch file from GitHub');
                }

                const fileData = await fileResponse.json();
                const sha = fileData.sha;

                // Create new content (active)
                const newContent = {
                    status: "active",
                    key: WEBSITE_KEY
                };

                const contentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(newContent, null, 2))));

                // Update file on GitHub
                const updateResponse = await fetch(GITHUB_API_URL, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    body: JSON.stringify({
                        message: 'Resumed website via admin panel',
                        content: contentBase64,
                        sha: sha,
                        branch: GITHUB_BRANCH
                    })
                });

                if (!updateResponse.ok) {
                    const errorData = await updateResponse.json();
                    throw new Error(errorData.message || 'Failed to update file');
                }

                showAdminMessage('✅ Website resumed successfully!', 'success');
                // Wait and refresh status
                setTimeout(fetchStatus, 1000);

            } catch (error) {
                console.error('❌ Resume error:', error);
                showAdminMessage('❌ Failed to resume: ' + error.message, 'error');
                resumeBtn.disabled = false;
                resumeBtn.textContent = '▶️ Resume Website';
            }
        }

        // ============================================================
        // 📢 MESSAGE HELPER
        // ============================================================

        function showAdminMessage(msg, type) {
            adminMessage.textContent = msg;
            adminMessage.className = 'message show ' + type;
        }

        function hideAdminMessage() {
            adminMessage.className = 'message';
            adminMessage.textContent = '';
        }

        // ============================================================
        // 🔐 GITHUB TOKEN - User Input
        // ============================================================

        let GITHUB_TOKEN = '';

        // Prompt for token when admin panel loads
        document.addEventListener('DOMContentLoaded', function() {
            // Token will be asked when user logs in
        });

        // Override login to ask for token
        const originalLogin = login;
        login = function() {
            const password = passwordInput.value.trim();

            if (password === ADMIN_PASSWORD) {
                // Ask for GitHub token
                const token = prompt(
                    '🔑 Enter your GitHub Personal Access Token:\n\n' +
                    'How to get:\n' +
                    '1. Go to GitHub Settings → Developer settings → Personal access tokens → Tokens (classic)\n' +
                    '2. Generate new token\n' +
                    '3. Select "repo" scope\n' +
                    '4. Copy and paste here'
                );

                if (!token || token.trim() === '') {
                    loginError.textContent = '❌ GitHub token is required!';
                    return;
                }

                GITHUB_TOKEN = token.trim();

                loginPage.classList.add('hidden');
                adminPanel.classList.remove('hidden');
                loginError.textContent = '';
                fetchStatus();
                setInterval(fetchStatus, 10000);
            } else {
                loginError.textContent = '❌ Invalid password! Please try again.';
                passwordInput.value = '';
                passwordInput.focus();
            }
        };

        console.log('✅ Admin Panel loaded!');
        console.log('🔑 Password:', ADMIN_PASSWORD);
        console.log('📁 GitHub Repo:', GITHUB_USERNAME + '/' + GITHUB_REPO);
        console.log('📄 File:', GITHUB_FILE);
    </script>

</body>
</html>
